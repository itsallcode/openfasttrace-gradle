name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  matrix-build:

    permissions:
      contents: read

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: "bash"
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-java-${{ matrix.java }}
      cancel-in-progress: true
    name: "Build with Java ${{ matrix.java }}"
    env:
      DEFAULT_JAVA: 17

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Cache SonarQube packages
      if: ${{ env.DEFAULT_JAVA == matrix.java }}
      uses: actions/cache@v6
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-java-${{ matrix.java }}-sonar
        restore-keys: ${{ runner.os }}-java-${{ matrix.java }}-sonar

    - name: Build with Java ${{ matrix.java }}
      run: |
        ./gradlew build --warning-mode fail \
                        --configuration-cache --configuration-cache-problems=fail \
                        --exclude-task ossIndexAudit \
                        -PjavaVersion=${{ matrix.java }}

    - name: Upload reports
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: reports-${{ runner.os }}-java-${{ matrix.java }}
        path: build/reports/

    - name: Sonar analysis
      if: ${{ env.DEFAULT_JAVA == matrix.java && env.SONAR_TOKEN != null }}
      run: ./gradlew sonar --info --warning-mode all -Dsonar.token=$SONAR_TOKEN
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ossindex:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Ossindex
      run: ./gradlew ossIndexAudit --warning-mode all --info
      env:
        ORG_GRADLE_PROJECT_ossIndexUsername: ${{ secrets.OSSINDEX_USERNAME }}
        ORG_GRADLE_PROJECT_ossIndexToken: ${{ secrets.OSSINDEX_TOKEN }}

  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure broken links checker
        run: |
          mkdir -p ./target
          echo '{ "aliveStatusCodes": [429, 200] }' > ./target/broken_links_checker.json
      - uses: tcort/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: ./target/broken_links_checker.json

  build:
    needs:
      - matrix-build
      - ossindex
      - linkChecker 
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - run: echo "Build successful"
